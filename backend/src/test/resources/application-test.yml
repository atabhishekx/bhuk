# Test profile override — uses H2 in-memory database for test isolation.
# This overrides src/main/resources/application-test.yml precedence.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-for-testing-only-not-for-production-use-123456
    expiration-ms: 86400000
  razorpay:
    webhook-secret: test_webhook_secret_12345

logging:
  level:
    com.restru: WARN
